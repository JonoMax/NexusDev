<div class="container manage-cars">
  <h3>Add Car</h3>

  <form (ngSubmit)="addCar()">
    <input
      type="text"
      placeholder="Make"
      [(ngModel)]="newCar.make"
      name="make"
      required
    />

    <input
      type="text"
      placeholder="Model"
      [(ngModel)]="newCar.model"
      name="model"
      required
    />

    <input
      type="number"
      placeholder="Year"
      [(ngModel)]="newCar.year"
      name="year"
      required
    />

    <input
      type="number"
      placeholder="Price"
      [(ngModel)]="newCar.price"
      name="price"
      required
    />

    <button type="submit">Add Car</button>
  </form>
</div>
